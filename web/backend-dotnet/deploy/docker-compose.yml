# QuantAssistant — .NET API + PostgreSQL + Caddy（生产拓扑，与目标 Linux 服务器一致）
# 用法：cd backend-dotnet/deploy && cp .env.example .env && 编辑 .env 后 docker compose up -d
services:
  db:
    image: postgres:18-alpine
    user: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: quant_assistant
    volumes:
      - pg-data:/var/lib/postgresql
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=quant_assistant;Username=quant;Password=${POSTGRES_PASSWORD}
    volumes:
      - ../migrations:/migrations:ro
    entrypoint: ["dotnet", "QuantAssistant.Api.dll", "--migrate", "/migrations"]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=quant_assistant;Username=quant;Password=${POSTGRES_PASSWORD}
      QUANT_DOMAIN: ${QUANT_DOMAIN:?Set QUANT_DOMAIN in .env}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      QUANT_DOMAIN: ${QUANT_DOMAIN:?Set QUANT_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  pg-data:
  caddy-data:
  caddy-config:
