name: verify-web

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --dev
        working-directory: web/backend
      - run: uv run python -B scripts/verify.py
        working-directory: web/backend
      - name: Verify result reporting
        run: uv run --project web/backend python .github/scripts/test_report.py --start .github/scripts --pattern 'test_*tests.py' --report test-results/reporting.json --title 'CI result accounting'
      - name: Python business tests (Linux subprocess protection included)
        run: uv run python -B ../../.github/scripts/test_report.py --start scripts --pattern 'verify_*.py' --report ../../test-results/python.json --title 'Python business tests'
        working-directory: web/backend
      - name: Source lint
        run: uv run --project web/backend ruff check --config web/backend/pyproject.toml .github/scripts web/worker web/backend-dotnet/tools/migrate_site.py web/backend-dotnet/tools/site_archive.py web/backend-dotnet/tools/site_files.py web/backend-dotnet/tools/site_lock.py web/backend-dotnet/tools/export_legacy_site.py web/backend-dotnet/tools/tests
      - name: Source format
        run: uv run --project web/backend ruff format --config web/backend/pyproject.toml --check .github/scripts web/worker web/backend-dotnet/tools/migrate_site.py web/backend-dotnet/tools/site_archive.py web/backend-dotnet/tools/site_files.py web/backend-dotnet/tools/site_lock.py web/backend-dotnet/tools/export_legacy_site.py web/backend-dotnet/tools/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-results
          path: test-results/
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install native Chromium for browser regression
        run: npx playwright install --with-deps chromium
      - name: Verify the supplied native Vue pages and local interactions
        run: npm run verify:ui
        env:
          QUANT_BROWSER_OUTPUT: browser-results
      - name: Build connected Vue interface independently of the supplied demo
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
          QUANT_WEB_OUTPUT_DIR: ../../output/index-strip-ui
      - name: Verify connected index identities, history and responsive layout
        run: node scripts/verify-index-strip.mjs
        env:
          QUANT_WEB_OUTPUT_DIR: ../../output/index-strip-ui
      - name: Verify connected fund catalog, combined filters and account action boundaries
        run: node scripts/verify-fund-catalog.mjs
        env:
          QUANT_WEB_OUTPUT_DIR: ../../output/index-strip-ui
      - name: Verify independent sector identities, sources and quality states
        run: node scripts/verify-sector-quality.mjs
        env:
          QUANT_WEB_OUTPUT_DIR: ../../output/index-strip-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression
          path: |
            web/frontend/browser-results
            output/playwright/index-strip
            output/playwright/fund-catalog
            output/playwright/sector-quality
          retention-days: 7

  dotnet-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build QuantAssistant.slnx -c Release
        working-directory: web/backend-dotnet

  # 归属: C 流 E21 —— 前端依赖漏洞扫描（npm audit，high 及以上阻断）。
  npm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  # 归属: C 流 E21 —— .NET 依赖漏洞扫描（直接 + 传递依赖）。
  dotnet-vulnerable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet list QuantAssistant.slnx package --vulnerable --include-transitive
        working-directory: web/backend-dotnet

  # 归属: C 流 E21 —— 迁移 --dry-run 冒烟测试。
  # A 流 E2 已在 MigrationRunner 实现 --dry-run/--rollback-to/--no-transaction，
  # Api 的 `--migrate <目录> [--dry-run] [--rollback-to <版本>] [--no-transaction]` 为约定接口。
  migration-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QUANT_TEST_PG_CONNECTION: Host=127.0.0.1;Port=55440;Database=quant_dryrun;Username=quant_test
      QUANT_PG_CONNECTION: Host=127.0.0.1;Port=55440;Database=quant_dryrun;Username=quant_test
      PGHOST: 127.0.0.1
      PGPORT: 55440
      PGUSER: quant_test
      PGDATABASE: quant_dryrun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install and start native PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-client-18
          sudo pg_createcluster 18 quantdryrun --port 55440 --start -- --auth-local=trust --auth-host=trust
          ready=false
          for attempt in $(seq 1 30); do
            if /usr/lib/postgresql/18/bin/pg_isready -h 127.0.0.1 -p 55440 -U postgres; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          /usr/lib/postgresql/18/bin/createuser -h 127.0.0.1 -p 55440 -U postgres --createdb quant_test
          /usr/lib/postgresql/18/bin/createdb -h 127.0.0.1 -p 55440 -U postgres -O quant_test quant_dryrun
      - run: dotnet build QuantAssistant.slnx -c Release
        working-directory: web/backend-dotnet
      - name: Migration --dry-run smoke test
        working-directory: web/backend-dotnet
        shell: bash
        run: |
          set -u
          dll=src/QuantAssistant.Api/bin/Release/net10.0/QuantAssistant.Api.dll
          # Runner 回退为启动 Web 服务会挂起，用 timeout 兜底。
          set +e
          timeout 90 dotnet "$dll" --migrate migrations --dry-run > dryrun.log 2>&1
          code=$?
          set -e
          cat dryrun.log
          if [ "$code" -eq 0 ]; then
            echo "migration --dry-run supported: OK"
          elif [ "$code" -eq 124 ]; then
            echo "::warning::Runner 尚未实现 --dry-run（命令疑似回退为启动服务，已超时终止）；本 job 标记为待 A 流 E2 就绪。"
          else
            echo "::warning::Runner --dry-run 退出码 $code；本 job 标记为待 A 流 E2 就绪。"
          fi

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QUANT_TEST_PG_CONNECTION: Host=127.0.0.1;Port=55439;Database=quant_test;Username=quant_test
      QUANT_PG_CONNECTION: Host=127.0.0.1;Port=55439;Database=quant_test;Username=quant_test
      QUANT_TEST_PG_DSN: host=127.0.0.1 port=55439 dbname=quant_test user=quant_test
      PGHOST: 127.0.0.1
      PGPORT: 55439
      PGUSER: quant_test
      PGDATABASE: quant_test
      QUANT_PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install and start native PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-client-18
          # Avoid dashes in cluster names: systemd unescapes them as path separators.
          sudo pg_createcluster 18 quantci --port 55439 --start -- --auth-local=trust --auth-host=trust
          ready=false
          for attempt in $(seq 1 30); do
            if /usr/lib/postgresql/18/bin/pg_isready -h 127.0.0.1 -p 55439 -U postgres; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          /usr/lib/postgresql/18/bin/psql -h 127.0.0.1 -p 55439 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'SELECT 1'
          /usr/lib/postgresql/18/bin/createuser -h 127.0.0.1 -p 55439 -U postgres --createdb quant_test
          /usr/lib/postgresql/18/bin/createdb -h 127.0.0.1 -p 55439 -U postgres -O quant_test quant_test
          /usr/lib/postgresql/18/bin/psql -v ON_ERROR_STOP=1 -c 'SELECT current_database(), current_user'
      - run: uv sync --project web/backend --frozen --dev
      - run: dotnet build QuantAssistant.slnx -c Release
        working-directory: web/backend-dotnet
      - run: dotnet src/QuantAssistant.Api/bin/Release/net10.0/QuantAssistant.Api.dll --migrate migrations
        working-directory: web/backend-dotnet
      - name: PostgreSQL .NET integration tests
        id: dotnet-tests
        run: dotnet test QuantAssistant.slnx -c Release --no-build --logger 'trx;LogFileName=dotnet.trx' --results-directory ../../test-results
        working-directory: web/backend-dotnet
      - name: Report .NET tests, failures and skip reasons
        if: always() && steps.dotnet-tests.outcome != 'skipped'
        run: uv run --project web/backend python .github/scripts/test_report.py --trx test-results/dotnet.trx --report test-results/dotnet.json --title '.NET PostgreSQL tests' --require-database
      - name: Native database tools tests
        run: uv run --project web/backend python .github/scripts/test_report.py --start web/backend-dotnet/tools/tests --report test-results/native-tools.json --title 'Native PostgreSQL tools'
      - name: Python worker tests
        run: uv run --project web/backend python .github/scripts/test_report.py --start web/worker/tests --report test-results/worker.json --title 'Python worker tests'
      - name: PostgreSQL failure diagnostics
        if: failure()
        shell: bash
        run: |
          pg_lsclusters || true
          sudo systemctl status postgresql@18-quantci.service --no-pager || true
          sudo journalctl -u postgresql@18-quantci.service --no-pager -n 100 || true
          sudo tail -n 100 /var/log/postgresql/postgresql-18-quantci.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-test-results
          path: test-results/
          retention-days: 7
