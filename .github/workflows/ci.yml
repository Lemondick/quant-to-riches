name: verify-web

on:
  push:
  pull_request:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: uv sync --frozen --dev
        working-directory: web/backend
      - run: uv run python -B scripts/verify.py
        working-directory: web/backend
      - run: uv run python -B -m unittest discover -s scripts -p 'verify_*.py' -v
        working-directory: web/backend
      - run: npm ci
        working-directory: web/frontend
      - run: npm run lint
        working-directory: web/frontend
      - run: npm run format:check
        working-directory: web/frontend
      - run: npm run typecheck
        working-directory: web/frontend
      - run: npm test
        working-directory: web/frontend
      - run: npm run build
        working-directory: web/frontend
      - name: Install native Chromium for browser regression
        run: npx playwright install --with-deps chromium
        working-directory: web/frontend
      - name: Verify the supplied native Vue pages and local interactions
        run: npm run verify:ui
        working-directory: web/frontend
        env:
          QUANT_BROWSER_OUTPUT: browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression
          path: web/frontend/browser-results
          retention-days: 7
      - run: uv run --project web/backend ruff check --config web/backend/pyproject.toml web/worker web/backend-dotnet/tools/migrate_site.py web/backend-dotnet/tools/site_archive.py web/backend-dotnet/tools/site_files.py web/backend-dotnet/tools/site_lock.py web/backend-dotnet/tools/export_legacy_site.py web/backend-dotnet/tools/tests
      - run: uv run --project web/backend ruff format --config web/backend/pyproject.toml --check web/worker web/backend-dotnet/tools/migrate_site.py web/backend-dotnet/tools/site_archive.py web/backend-dotnet/tools/site_files.py web/backend-dotnet/tools/site_lock.py web/backend-dotnet/tools/export_legacy_site.py web/backend-dotnet/tools/tests

  dotnet:
    runs-on: ubuntu-24.04
    env:
      QUANT_TEST_PG_CONNECTION: Host=127.0.0.1;Port=55439;Database=quant_test;Username=quant_test
      QUANT_PG_CONNECTION: Host=127.0.0.1;Port=55439;Database=quant_test;Username=quant_test
      QUANT_TEST_PG_DSN: host=127.0.0.1 port=55439 dbname=quant_test user=quant_test
      PGHOST: 127.0.0.1
      PGPORT: 55439
      PGUSER: quant_test
      PGDATABASE: quant_test
      QUANT_PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install and start native PostgreSQL 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-client-18
          sudo pg_createcluster 18 quant-ci --port 55439 --start -- --auth-local=trust --auth-host=trust
          /usr/lib/postgresql/18/bin/createuser -h 127.0.0.1 -p 55439 -U postgres --createdb quant_test
          /usr/lib/postgresql/18/bin/createdb -h 127.0.0.1 -p 55439 -U postgres -O quant_test quant_test
      - run: uv sync --project web/backend --frozen --dev
      - run: dotnet build QuantAssistant.slnx -c Release
        working-directory: web/backend-dotnet
      - run: dotnet src/QuantAssistant.Api/bin/Release/net10.0/QuantAssistant.Api.dll --migrate migrations
        working-directory: web/backend-dotnet
      - run: dotnet test QuantAssistant.slnx -c Release --no-build
        working-directory: web/backend-dotnet
      - run: uv run --project web/backend python -m unittest discover -s web/backend-dotnet/tools/tests -v
      - run: uv run --project web/backend python -m unittest discover -s web/worker/tests -v
